
name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  sync:
    name: Synchronize repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changes to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: ${{ vars.GITLAB_REPOSITORY }}
        run: |
          set -e

          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w 0)

          git \
            -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push \
            "https://gitlab.com/${GITLAB_REPOSITORY}.git" \
            HEAD:refs/heads/main
